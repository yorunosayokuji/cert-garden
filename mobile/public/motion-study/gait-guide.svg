  </g>
  <!-- 08 (87.5%): 運び=LH -->
  <g transform="translate(1152,256)">
    <use xlink:href="#cellBg"/>
    <use xlink:href="#hh3" transform="translate(7,-5)" color="#7A4FC4"/>
    <use xlink:href="#ff1" transform="translate(7,-5)" color="#3B7DD8"/>
    <use xlink:href="#body"/>
    <use xlink:href="#hh7" color="#F29A2E"/>
