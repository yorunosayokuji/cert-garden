    <use xlink:href="#cellBg"/>
    <use xlink:href="#hh0" transform="translate(7,-5)" color="#7A4FC4"/>
    <use xlink:href="#ff6" transform="translate(7,-5)" color="#3B7DD8"/>
    <use xlink:href="#body"/>
    <use xlink:href="#hh4" color="#F29A2E"/>
    <use xlink:href="#ff2" color="#E8604C"/>
    <use xlink:href="#legend"/>
    <text x="14" y="34" font-size="28" font-weight="700" fill="#3A2E26">05</text>
    <text x="14" y="54" font-size="12" fill="#3A2E26">周期50%　運び: RF</text>
    <text x="14" y="70" font-size="12" fill="#3A2E26">接地: RH</text>
  </g>
  <!-- 06 (62.5%): 運び=RF -->
  <g transform="translate(384,256)">
    <use xlink:href="#cellBg"/>
    <use xlink:href="#hh1" transform="translate(7,-5)" color="#7A4FC4"/>
    <use xlink:href="#ff7" transform="translate(7,-5)" color="#3B7DD8"/>
    <use xlink:href="#body"/>
    <use xlink:href="#hh5" color="#F29A2E"/>
    <use xlink:href="#ff3" color="#E8604C"/>
