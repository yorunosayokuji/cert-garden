    <use xlink:href="#hh2" transform="translate(7,-5)" color="#7A4FC4"/>
    <use xlink:href="#ff0" transform="translate(7,-5)" color="#3B7DD8"/>
    <use xlink:href="#body"/>
    <use xlink:href="#hh6" color="#F29A2E"/>
    <use xlink:href="#ff4" color="#E8604C"/>
