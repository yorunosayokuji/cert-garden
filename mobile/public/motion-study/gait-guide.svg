<?xml version="1.0" encoding="UTF-8"?>
<!-- 歩行の骨格ガイド（画像生成への設計資料）。最終キャラの絵でも、解剖図・生体測定の結果でもない。
     座標は scripts/gen-gait-guide.mjs と同じ式（2関節IK）を手計算した値（小数1桁）。親が mjs を実行すると同じ構成で再生成される。
     向き: 左向き（進行方向は左）。近い側=左(LH/LF)=暖色、遠い側=右(RH/RF)=寒色。
     接地位相: LH 0% / LF 25% / RH 50% / RF 75%。支持65%・運び35%。8姿勢は周期の 0,12.5,…,87.5%。
     支持中の足は床の上で体に対して後方(右)へ一定速度で移動、遊脚は上に弧を描いて前方(左)へ運ぶ。
     1周期の歩幅60単位（=20論理px×3）。支持中の足の体に対する移動量は 60×0.65=39単位。
     屈曲: 前脚は 肩→肘(後ろへ折れる)→手根→足。後脚は 股→膝(前へ折れる)→飛節(後ろへ折れる)→足。 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="512" viewBox="0 0 1536 512" font-family="'Noto Sans JP','Meiryo',sans-serif">
  <title>歩行の骨格ガイド 8主要姿勢（設計図）</title>
  <desc>横向き左の単純な四足骨格。LH/LF=近い側(橙/珊瑚)、RH/RF=遠い側(紫/青)。接地 LH0% LF25% RH50% RF75%、支持65%・運び35%。設計図であり、解剖図や測定結果ではありません。</desc>
  <defs>
    <!-- 前脚（近い側の座標）: 肩(126,114) → 肘 → 手根 → 足。k=周期位置 k/8 -->
    <g id="ff0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 127.5,154 106.5,188 106.5,212"/><circle cx="127.5" cy="154" r="4" fill="#fff" stroke-width="2.5"/><circle cx="106.5" cy="188" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="103.5" cy="210" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff1" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 133.8,153.2 114,188 114,212"/><circle cx="133.8" cy="153.2" r="4" fill="#fff" stroke-width="2.5"/><circle cx="114" cy="188" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="111" cy="210" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff2" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 138.8,151.9 121.5,188 121.5,212"/><circle cx="138.8" cy="151.9" r="4" fill="#fff" stroke-width="2.5"/><circle cx="121.5" cy="188" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="118.5" cy="210" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff3" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 142.6,150.4 129,188 129,212"/><circle cx="142.6" cy="150.4" r="4" fill="#fff" stroke-width="2.5"/><circle cx="129" cy="188" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="126" cy="210" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff4" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 145.4,149 136.5,188 136.5,212"/><circle cx="145.4" cy="149" r="4" fill="#fff" stroke-width="2.5"/><circle cx="136.5" cy="188" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="133.5" cy="210" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 146.9,148.1 144,188 144,212"/><circle cx="146.9" cy="148.1" r="4" fill="#fff" stroke-width="2.5"/><circle cx="144" cy="188" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="141" cy="210" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 156.9,139.4 130.1,169.1 138.1,191.7"/><circle cx="156.9" cy="139.4" r="4" fill="#fff" stroke-width="2.5"/><circle cx="130.1" cy="169.1" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="135.1" cy="189.7" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
    <g id="ff7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="126,114 145.6,148.9 109.5,166 117.5,188.6"/><circle cx="145.6" cy="148.9" r="4" fill="#fff" stroke-width="2.5"/><circle cx="109.5" cy="166" r="4" fill="#fff" stroke-width="2.5"/><ellipse cx="114.5" cy="186.6" rx="8" ry="4" fill="currentColor" stroke="none"/></g>
